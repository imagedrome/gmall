<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gmall.com</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    text-align: center;
  }
  .logo {
    width: 320px;
    max-width: 80%;
    margin-top: 240px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 120px;
  }
  .stack img {
    display: block;
  }
  .email {
    width: 60px;
    margin-bottom: 16px;
  }
  .main-text {
    width: 400px;
    margin-bottom: 10px;
  }
  .sub-text {
    width: 480px;
    margin-top: 20px;
  }

  @media (max-width: 600px) {
    .logo {
      width: 200px;
      margin-top: 160px;
    }
    .email {
      width: 45px;
      margin-bottom: 12px;
    }
    .main-text {
      width: 280px;
      margin-bottom: 6px;
    }
    .sub-text {
      width: 340px;
      margin-top: 14px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <img class="logo" src="images/main_logo@2x.png"
         srcset="images/main_logo@1x.png 1x, images/main_logo@2x.png 2x"
         alt="gmall.com logo">

    <div class="stack">
      <a id="emailLink">
        <img class="email" src="images/email@2x.png"
             srcset="images/email@1x.png 1x, images/email@2x.png 2x"
             alt="Email icon">
      </a>

      <a id="mainTextLink">
        <img class="main-text" src="images/main_text@2x.png"
             srcset="images/main_text@1x.png 1x, images/main_text@2x.png 2x"
             alt="For inquiries about this domain, please contact us via email.">
      </a>

      <a id="gmailLink">
        <img class="sub-text" src="images/sub_text@2x.png"
             srcset="images/sub_text@1x.png 1x, images/sub_text@2x.png 2x"
             alt="This site is not affiliated with Gmail or Google. If you are looking for Gmail, please visit gmail.com.">
      </a>
    </div>
  </div>

  <script>
  (function(){
    const u = 'domain';
    const d = 'imagedrome.com';
    const mail = 'mailto:' + u + '@' + d;
    document.getElementById('emailLink').href = mail;
    document.getElementById('mainTextLink').href = mail;
    document.getElementById('gmailLink').href = 'https://www.gmail.com/';
  })();
  </script>
</body>
</html>

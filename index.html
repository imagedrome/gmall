<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GMALL.COM</title>
<meta name="robots" content="noindex">
<style>
:root {
  --top-gap:240px;
  --side-pad:120px;
  --mid-gap:240px;
  --bottom-pad:84px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  background:#d03165;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.page { min-height:100%; display:flex; flex-direction:column; }
.content {
  flex:1 0 auto;
  padding:var(--top-gap) var(--side-pad) var(--bottom-pad);
  display:flex;
  flex-direction:column;
  align-items:center;
}
.logo {
  width:420px; height:auto;
}
.mid-gap { height:240px; }
.stack {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.email { width:84px; height:auto; cursor:pointer; max-width:none; }
.main-text { width:400px; height:auto; cursor:pointer; max-width:none; }
.sub-text { width:580px; height:auto; cursor:pointer; max-width:none; }

@media (max-width:480px){
  .content{padding:120px 24px 60px;}
  .logo{width:70vw;}
  .email{width:17vw;}
  .main-text{width:60vw;}
  .sub-text{width:85vw;}
}
</style>
</head>
<body>
<main class="page">
  <div class="content">
    <img class="logo" src="images/logo@2x.png"
         srcset="images/logo@1x.png 1x, images/logo@2x.png 2x"
         alt="GMALL.COM">
    <div class="mid-gap"></div>
    <div class="stack">
      <a id="emailLink">
        <img class="email" src="images/email@2x.png"
             srcset="images/email@1x.png 1x, images/email@2x.png 2x"
             alt="Email icon">
      </a>
      <a id="mainTextLink">
        <img class="main-text" src="images/main_text@2x.png"
             srcset="images/main_text@1x.png 1x, images/main_text@2x.png 2x"
             alt="For inquiries about this domain, please contact us via email.">
      </a>
      <a id="gmailLink">
        <img class="sub-text" src="images/sub_text@2x.png"
             srcset="images/sub_text@1x.png 1x, images/sub_text@2x.png 2x"
             alt="This site is not affiliated with Gmail or Google. If you are looking for Gmail, please visit gmail.com.">
      </a>
    </div>
  </div>
</main>
<script>
(function(){
  const u='domain', d='imagedrome.com';
  const mail='mailto:'+u+'@'+d;
  document.getElementById('emailLink').href=mail;
  document.getElementById('mainTextLink').href=mail;
  document.getElementById('gmailLink').href='https://www.gmail.com/';
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GMALL.COM</title>

<meta name="robots" content="index,follow" />

<meta name="description" content="GMALL.COM is a premium e-commerce domain, privately owned since 2000. 
For inquiries related to GMALL.COM, please contact us via email. 
This site is not affiliated with Gmail or Google. If you were trying to visit Google’s Gmail, please go directly to the official Gmail website (gmail.com)." />
<meta name="keywords" content="GMALL, gmall.com, gmail, domain, sale, contact, business,iOS inquiry, broong, imagedrome" />

<meta property="og:title" content="GMALL.COM" />
<meta property="og:description" content="GMALL.COM is independent and unrelated to Gmail. For inquiries, please contact us via email." />
<meta property="og:url" content="https://gmall.com" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://gmall.com/images/logo@2x.png" />

<style>
:root {
  --top-gap:120px;
  --side-pad:60px;
  --mid-gap:120px;
  --bottom-pad:42px;
  --logo-w:420px;
  --email-w:42px;
  --main-text-w:200px;
  --sub-text-w:290px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:#d03165;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.page{min-height:100%;display:flex;flex-direction:column;}
.content{
  flex:1 0 auto;
  padding:var(--top-gap) var(--side-pad) var(--bottom-pad);
  display:flex;
  flex-direction:column;
  align-items:center;
}
.logo{width:var(--logo-w);max-width:100%;display:block;height:auto;}
.mid-gap{height:var(--mid-gap);}
.stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:0;
}
.stack img{display:block;height:auto;}
.email{width:var(--email-w);max-width:100%;cursor:pointer;}
.main-text{width:var(--main-text-w);max-width:100%;cursor:pointer;}
.sub-text{width:var(--sub-text-w);max-width:100%;cursor:pointer;}
.copyright {
  width: 180px;
  max-width: 100%;
  margin-top: 8px;
  opacity: 0.8;
  display: block;
}
@media (max-width:480px){
  .content{padding:120px 24px 60px;}
  img{max-width:90vw;height:auto;}
}
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": "https://gmall.com",
  "name": "GMALL.COM",
  "alternateName": "G Mall",
  "description": "GMALL.COM is a premium e-commerce domain, privately owned since 2000. This site is not affiliated with Gmail or Google. For Gmail, please visit gmail.com.",
  "potentialAction": {
    "@type": "ContactAction",
    "target": "mailto:contact@gmall.com",
    "name": "Contact GMALL.COM"
  }
}
</script>
<link rel="canonical" href="https://gmall.com/">
</head>
<body>
<main class="page">
  <div class="content">
    <img class="logo" src="images/logo@2x.png" srcset="images/logo@1x.png 1x, images/logo@2x.png 2x" alt="GMALL.COM">
    <div class="mid-gap"></div>
    <div class="stack">
      <a id="emailLink"><img class="email" src="images/email@2x.png" srcset="images/email@1x.png 1x, images/email@2x.png 2x" alt="Email icon"></a>
      <a id="mainTextLink"><img class="main-text" src="images/main_text@2x.png" srcset="images/main_text@1x.png 1x, images/main_text@2x.png 2x" alt="Contact us via email"></a>
      <a href="https://gmail.com" target="_blank" rel="noopener">
        <img class="sub-text" src="images/sub_text@2x.png" srcset="images/sub_text@1x.png 1x, images/sub_text@2x.png 2x" alt="This domain is independent from Gmail">
      </a><img class="copyright" src="images/copyright@2x.png" srcset="images/copyright@1x.png 1x, images/copyright@2x.png 2x" alt="© 2000–2025 GMALL.COM. All rights reserved.">
    </div>
  </div>
</main>
<script>
(function(){
  const u = 'domain', d = 'imagedrome.com';
  const subject = 'Inquiry from GMALL.COM';
  const mail = `mailto:${u}@${d}?subject=${encodeURIComponent(subject)}`;

  const emailLink = document.getElementById('emailLink');
  const mainTextLink = document.getElementById('mainTextLink');

  [emailLink, mainTextLink].forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      window.open(mail, '_blank');
    });
  });
})();
</script>
</body>
</html>
